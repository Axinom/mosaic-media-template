apiVersion: apps/v1
kind: Deployment
metadata:
  name: entitlement
spec:
  template:
    spec:
      nodeSelector:
        mosaic.axinom.com/workload_type: customizable-services
        mosaic.axinom.com/hosting_node_pool: basic_balanced_axinom_owned
      tolerations:
        - key: mosaic.axinom.com/customizable-services
          operator: Equal
          value: 'True'
          effect: NoSchedule
      containers:
        - name: app
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: DEBUG
            - name: POSTGRESQL_HOST
              value: mosaic-prod-ubi-customizable-pub.pgm6jr3cwhzp7me4q9fxpm6217.postgres.ubicloud.com
            - name: POSTGRESQL_PORT
              value: '5432'
            - name: POSTGRESQL_USER_SUFFIX
              value: ''
            - name: PGSSLMODE
              value: verify-ca
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: database-name
            - name: DATABASE_OWNER
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: database-owner-username
            - name: DATABASE_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: database-owner-password
            - name: DATABASE_LOGIN
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: database-login-username
            - name: DATABASE_LOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: database-login-password
            - name: DATABASE_GQL_ROLE
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: database-gql-username
            - name: RABBITMQ_PROTOCOL
              value: amqps
            - name: RABBITMQ_VHOST
              value: 16b0tks5rqq2qoobqvo5fxhfj_8j0cretxi7muq1cgjvp4fwurw
            - name: RABBITMQ_HOST
              value: rabbitmq.eu.axinom.net
            - name: RABBITMQ_PORT
              value: '5671'
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: rabbitmq-password
            - name: RABBITMQ_DEV_MIDDLEWARE
              value: 'false'
            - name: RABBITMQ_VHOST_ASSERT
              value: 'false'
            - name: RABBITMQ_MGMT_PROTOCOL
              value: https
            - name: RABBITMQ_MGMT_HOST
              value: rabbitmq.eu.axinom.net
            - name: RABBITMQ_MGMT_PORT
              value: '15671'
            - name: TENANT_ID
              value: 13d99de7-b726-45f8-a03d-7935e116b97f
            - name: ENVIRONMENT_ID
              value: 900c8d55-31d4-43ba-a73a-3f2289a7b2cc
            - name: MOSAIC_TESTING_IP_ENABLED
              value: 'true'
            - name: DRM_LICENSE_COMMUNICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: drm-license-communication-key
            - name: DRM_LICENSE_COMMUNICATION_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: drm-license-communication-key-id
            - name: GEOLITE2_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: geolite2-license-key
            - name: SERVICE_ACCOUNT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: service-account-client-id
            - name: SERVICE_ACCOUNT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: service-account-client-secret
            - name: CATALOG_SERVICE_BASE_URL
              value: https://mosaic-ott-catalog.axprod.net/
            - name: USER_SERVICE_AUTH_BASE_URL
              value: https://user-auth.service.eu.axinom.net
            - name: ID_SERVICE_AUTH_BASE_URL
              value: https://id.service.eu.axinom.net
            - name: ENTITLEMENT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: entitlement-webhook-secret
            - name: MANIFEST_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: key-vault-entitlement
                  key: manifest-webhook-secret
            - name: WIDEVINE_LICENSE_SERVICE_URL
              value: https://drm-widevine-licensing.axprod.net/AcquireLicense
            - name: PLAYREADY_LICENSE_SERVICE_URL
              value: https://drm-playready-licensing.axprod.net/AcquireLicense
            - name: FAIRPLAY_LICENSE_SERVICE_URL
              value: https://drm-fairplay-licensing.axprod.net/AcquireLicense
            - name: FAIRPLAY_STREAMING_CERTIFICATE_URL
              value: https://vtb.axinom.com/FPScert/fairplay.cer
