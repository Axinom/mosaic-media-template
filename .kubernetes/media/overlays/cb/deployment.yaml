apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: NODE_ENV
              value: test
            - name: LOG_LEVEL
              value: DEBUG
            - name: POSTGRESQL_HOST
              value: mosaic-dev-ubi-pub.pgr9c261pwk62k1qyvf5j62vn5.postgres.ubicloud.com
            - name: POSTGRESQL_PORT
              value: '5432'
            - name: POSTGRESQL_USER_SUFFIX
              value: ''
            - name: PGSSLMODE
              value: verify-ca
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: database-name
            - name: DATABASE_OWNER
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: database-owner-username
            - name: DATABASE_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: database-owner-password
            - name: DATABASE_LOGIN
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: database-login-username
            - name: DATABASE_LOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: database-login-password
            - name: DATABASE_GQL_ROLE
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: database-gql-username
            - name: IS_LOCALIZATION_ENABLED
              value: 'true'
            - name: RABBITMQ_PROTOCOL
              value: amqps
            - name: RABBITMQ_VHOST
              value: wv6ypvgnbca9op5fkz5xah5p_ecc5zfwhykx6c5ohthlz28mxm
            - name: RABBITMQ_HOST
              value: rabbitmq.test.axinom.net
            - name: RABBITMQ_PORT
              value: '5671'
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: rabbitmq-password
            - name: RABBITMQ_DEV_MIDDLEWARE
              value: 'false'
            - name: RABBITMQ_VHOST_ASSERT
              value: 'false'
            - name: RABBITMQ_MGMT_PROTOCOL
              value: https
            - name: RABBITMQ_MGMT_HOST
              value: rabbitmq.test.axinom.net
            - name: RABBITMQ_MGMT_PORT
              value: '15671'
            - name: TENANT_ID
              value: 0f6bc3c4-9e70-4aba-9dfe-8bf32be99a5d
            - name: ENVIRONMENT_ID
              value: f2440a8a-eb88-41ba-832b-752c364d641a
            - name: SERVICE_ACCOUNT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: service-account-client-id
            - name: SERVICE_ACCOUNT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: key-vault-media
                  key: service-account-client-secret
            - name: ID_SERVICE_AUTH_BASE_URL
              value: https://id.service.cb.axinom.net
            - name: VIDEO_SERVICE_BASE_URL
              value: https://video.service.cb.axinom.net
            - name: IMAGE_SERVICE_BASE_URL
              value: https://image.service.cb.axinom.net
            - name: LOCALIZATION_SERVICE_BASE_URL
              value: https://localization.service.cb.axinom.net
