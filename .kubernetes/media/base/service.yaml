apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: '10503'
    prometheus.io/scrape: 'true'
  name: media
spec:
  type: ClusterIP
  selector:
    app: media
  ports:
    - name: app
      port: 10200
      protocol: TCP
      targetPort: 10200
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
    - name: diagnostics
      port: 9911
      protocol: TCP
      targetPort: 9911
