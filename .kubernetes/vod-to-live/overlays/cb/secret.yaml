apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv-vod-to-live
spec:
  provider:
    azurekv:
      authSecretRef:
        clientId:
          key: ClientId
          name: azure-external-access-service-principal-credentials
        clientSecret:
          key: ClientSecret
          name: azure-external-access-service-principal-credentials
      authType: ServicePrincipal
      environmentType: PublicCloud
      tenantId: db0b4725-608f-4d84-b2e3-7fc15b0cb2d4
      vaultUrl: https://cus-cb-vod2lv-bPt.vault.azure.net
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: key-vault-vod-to-live
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: SecretStore
    name: azure-kv-vod-to-live
  target:
    name: key-vault-vod-to-live
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: secret/api-key
    - secretKey: rabbitmq-password
      remoteRef:
        key: secret/rabbitmq-password
    - secretKey: rabbitmq-user
      remoteRef:
        key: secret/rabbitmq-user
    - secretKey: azure-storage-connection
      remoteRef:
        key: secret/azure-storage-connection
    - secretKey: service-account-client-secret
      remoteRef:
        key: secret/service-account-client-secret
    - secretKey: service-account-client-id
      remoteRef:
        key: secret/service-account-client-id
