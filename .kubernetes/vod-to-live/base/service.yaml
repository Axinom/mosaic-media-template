apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: '11900'
    prometheus.io/scrape: 'true'
  name: vod-to-live
spec:
  type: ClusterIP
  selector:
    app: vod-to-live
  ports:
    - name: app
      port: 11900
      protocol: TCP
      targetPort: 11900
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
    - name: diagnostics
      port: 9911
      protocol: TCP
      targetPort: 9911
