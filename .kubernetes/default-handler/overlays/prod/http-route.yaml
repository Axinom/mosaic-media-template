---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-handler
spec:
  hostnames:
    - '*.hosted.eu.axinom.cloud'
  parentRefs:
    - name: mosaic
      namespace: gateway
  rules:
    # No backendRefs on purpose - the SnippetsFilter terminates the request
    # inside NGINX with a JSON 404 before any upstream is selected.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: default-handler-not-found
