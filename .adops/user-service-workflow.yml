              MOSAIC_HOSTING_CLIENT_SECRET: $(mosaicHostingClientSecretLovAcc)

      - job: Release_lov_prod
        dependsOn: Build
        displayName: 'Release - LOV production'
        condition: ${{ eq(parameters.lov_production, true) }}
        variables:
          PKG_VER: $[ dependencies.Build.outputs['setPackageVersion.pkgVer'] ]
        steps:
          - script: |
