                yarn run pilet publish --no-fresh --url "https://frontends.service.eu.axinom.net/v1/pilets/$(tenantId)/3b57b976-446a-4ae6-9ead-e4feec58ba7e" --api-key "$(serviceAccountCredentialsNfnAcc)" --fields.MANAGEMENT_HOST "dc-nfn-ms-user-acceptance.axprod.net" --fields.MANAGEMENT_HTTP_PROTOCOL "https" $(Pipeline.Workspace)/drop/user-workflows-$(PKG_VER).tgz
            env:
              MOSAIC_HOSTING_CLIENT_ID: $(mosaicHostingClientIdNfnAcc)
              MOSAIC_HOSTING_CLIENT_SECRET: $(mosaicHostingClientSecretNfnAcc)

      - job: Release_nfn_prod
        dependsOn: Build
        displayName: 'Release - NFN production'
        condition: ${{ eq(parameters.nfn_production, true) }}
        variables:
          PKG_VER: $[ dependencies.Build.outputs['setPackageVersion.pkgVer'] ]
        steps:
          - script: |
