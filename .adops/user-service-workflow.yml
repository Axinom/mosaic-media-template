trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  tag: '$(Build.BuildNumber)'
  serviceId: dc-user-service
  tenantId: '19727078-1284-4708-bda6-8792c2011752'
  ID_SERVICE_AUTH_BASE_URL: https://id.service.eu.axinom.net

parameters:
  - name: int
    displayName: Release to INT
    type: boolean
    default: true
  - name: nfn_acceptance
    displayName: Release to NFN acceptance
    type: boolean
    default: false
  - name: nfn_production
    displayName: Release to NFN production
    type: boolean
    default: false
  - name: lov_acceptance
    displayName: Release to LOV acceptance
    type: boolean
    default: false
  - name: lov_production
    displayName: Release to LOV production
    type: boolean
    default: false
  - name: flx_acceptance
    displayName: Release to FLX acceptance
    type: boolean
    default: false
  - name: flx_production
    displayName: Release to FLX production
    type: boolean
    default: false

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Install Node.js'

          - script: |
              ORIGINAL_PKG_VER=`npx -q json -f "$(packageRoot)/package.json" version`
              NEW_PKG_VER="${ORIGINAL_PKG_VER}-$(tag)"
              echo "##vso[task.setvariable variable=pkgVer;isOutput=true]${NEW_PKG_VER}"

              echo "Current package.json version is: [${ORIGINAL_PKG_VER}]"
              echo "Updating package.json version to: [${NEW_PKG_VER}]"
              
              npx -q json -I -f "$(packageRoot)/package.json" -e "this.version = '${NEW_PKG_VER}'"
              
              echo "Updated package.json version is: [`npx -q json -f \"$(packageRoot)/package.json\" version`]"
            displayName:
              'Updating package.json version to reflect the build number'
            name: setPackageVersion

          - script: |
              npm run $(packageBuildCommand)
            displayName: 'Build pilet'

          - task: CopyFiles@2
            inputs:
              Contents: '*.tgz'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
            displayName: Copy pilet package artifact to staging directory

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
            displayName: Publishing build artifact

      - job: Release_int
        dependsOn: Build
        displayName: 'Release - INT'
        condition: ${{ eq(parameters.int, true) }}
        variables:
          PKG_VER: $[ dependencies.Build.outputs['setPackageVersion.pkgVer'] ]
        steps:
          - script: |
              npm run $(packageBuildCommand)
            displayName: 'Build pilet'

          - download: current
            artifact: drop
            displayName: 'Download build artifact'

          - task: Bash@3
            displayName:
              'Upload pilet to INT environment'
            inputs:
              targetType: 'inline'
              script: |
                yarn run pilet publish --no-fresh --url "https://frontends.service.eu.axinom.net/v1/pilets/c9165f62-bbb5-4fd4-8669-6e56c2b536d4/c43bfd95-d8c8-4937-991f-4566e84d6967" --api-key "$(serviceAccountCredentialsInt)" --fields.MANAGEMENT_HOST "dc-ms-user-int.axtest.net" --fields.MANAGEMENT_HTTP_PROTOCOL "https" $(Pipeline.Workspace)/drop/user-workflows-$(PKG_VER).tgz
            env:
              MOSAIC_HOSTING_CLIENT_ID: $(mosaicHostingClientIdInt)
              MOSAIC_HOSTING_CLIENT_SECRET: $(mosaicHostingClientSecretInt)

      - job: Release_nfn_acc
        dependsOn: Build
        displayName: 'Release - NFN acceptance'
        condition: ${{ eq(parameters.nfn_acceptance, true) }}
        variables:
          PKG_VER: $[ dependencies.Build.outputs['setPackageVersion.pkgVer'] ]
        steps:
          - script: |
              npm run $(packageBuildCommand)
            displayName: 'Build pilet'

          - download: current
            artifact: drop
            displayName: 'Download build artifact'

          - task: Bash@3
            displayName:
              'Upload pilet to NFN acceptance environment'
            inputs:
