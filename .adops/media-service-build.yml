              MOSAIC_HOSTING_CLIENT_SECRET: $(mosaicHostingClientSecretLovAcc)
              ID_SERVICE_AUTH_BASE_URL: https://id.service.eu.axinom.net
              HOSTING_SERVICE_BASE_URL: https://hosting.service.eu.axinom.net

      - job: Upload_LOV_Production
        dependsOn: Build
        displayName: 'Upload Manifest to LOV Production'
        condition: ${{ eq(parameters.lov_production, true) }}
