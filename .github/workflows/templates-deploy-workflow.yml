name: Deploy Single Workflow Template

on:
  workflow_call:
    secrets:
      workflow-publish-api-key:
        required: false
        description: API key for publishing pilets to the frontend service (customer pilets)
      managed-workflow-publish-api-key:
        required: false
        description: API key for publishing pilets to the hosting service (managed pilets)
    inputs:
      deploy:
        required: true
        type: boolean
        description: Indicates if this should be deployed
      runs-on:
        required: true
        type: string
      environment:
        required: true
        type: string
        description: GitHub environment name for deployment
      workflow-name:
        required: true
        type: string
        description: Name of the workflow being deployed
      artifact-pattern:
        required: true
        type: string
        description: Pattern to match in the artifact path (e.g., "channel-workflows", "media-workflows")
      publish-base-url:
        required: true
        type: string
        description: Base URL for pilet publishing (e.g., https://frontends.service.cb.axinom.net)
      service-name:
        required: true
        type: string
        description: Service name for managed pilet URL (e.g., ax-media-service, ax-channel-service)
      tenant-id:
        required: true
        type: string
        description: Tenant ID for customer pilet URL
      environment-id:
        required: true
        type: string
        description: Environment ID for customer pilet URL
      hosting-service-enabled:
        required: true
        type: boolean
        description: Enable managed/hosting service pilet publish
      extra-fields:
        required: false
        type: string
        default: ''
        description: Additional --fields arguments for pilet publish
      build-run-id:
        required: true
        type: string
        description: Build run ID to download artifacts from

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ inputs.deploy }}
    name: Deploy ${{ inputs.workflow-name }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          pattern: "*${{ inputs.artifact-pattern }}*"
          path: ./artifacts
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Publish customer pilet
        working-directory: ./artifacts
        run: |
          set +e  # Disable exit on error to capture command output

          # Find .tgz file matching the pattern and extract its directory
          TGZ_FILE=$(find . -type f -name "*.tgz" -path "*${{ inputs.artifact-pattern }}*" | head -1)
          if [ -z "$TGZ_FILE" ]; then
            echo "::error::No .tgz file found matching pattern '${{ inputs.artifact-pattern }}'"
            exit 1
          fi

          ARTIFACT_DIR=$(dirname "$TGZ_FILE")
          cd "$ARTIFACT_DIR"
          echo "::notice::Publishing from: $(pwd)"
          ls -la *.tgz

          # Sleep for random seconds up to 30 to avoid simultaneous uploads
          sleep $((RANDOM % 30))

          PUBLISH_URL="${{ inputs.publish-base-url }}/v1/pilets/${{ inputs.tenant-id }}/${{ inputs.environment-id }}"
          echo "::notice::Publishing to: $PUBLISH_URL"

          response=$(npx --node-options='--unhandled-rejections=strict' --package=piral-cli@1.5.2 --yes pilet publish \
            --no-fresh \
            --url "$PUBLISH_URL" \
            --api-key "${{ secrets.workflow-publish-api-key }}" \
            ${{ inputs.extra-fields }} 2>&1)
          exit_code=$?
          echo "$response"

          if [ $exit_code -ne 0 ]; then
            echo "::error::npx command failed with exit code $exit_code"
            exit 1
          fi

          if echo "$response" | grep -q '"success": true' && echo "$response" | grep -q '"status": 200'; then
            echo "::notice::Response validated and marked as a successful upload"
          else
            echo "::error::Response contained non-200 status or success was not true. Marked as an unsuccessful upload"
            exit 1
          fi

      - name: Publish managed pilet (hosting service)
        if: ${{ inputs.hosting-service-enabled }}
        working-directory: ./artifacts
        run: |
          set +e  # Disable exit on error to capture command output

          # Find .tgz file matching the pattern and extract its directory
          TGZ_FILE=$(find . -type f -name "*.tgz" -path "*${{ inputs.artifact-pattern }}*" | head -1)
          if [ -z "$TGZ_FILE" ]; then
            echo "::error::No .tgz file found matching pattern '${{ inputs.artifact-pattern }}'"
            exit 1
          fi

          ARTIFACT_DIR=$(dirname "$TGZ_FILE")
          cd "$ARTIFACT_DIR"
          echo "::notice::Publishing managed pilet from: $(pwd)"
          ls -la *.tgz

          PUBLISH_URL="${{ inputs.publish-base-url }}/v1/axinom-owned-customizable-pilets/${{ inputs.service-name }}"
          echo "::notice::Publishing to: $PUBLISH_URL"

          response=$(npx --node-options='--unhandled-rejections=strict' --package=piral-cli@1.5.2 --yes pilet publish \
            --no-fresh \
            --url "$PUBLISH_URL" \
            --api-key "${{ secrets.managed-workflow-publish-api-key }}" \
            2>&1)
          exit_code=$?
          echo "$response"

          if [ $exit_code -ne 0 ]; then
            echo "::error::npx command failed with exit code $exit_code"
            exit 1
          fi

          if echo "$response" | grep -q '"success": true' && echo "$response" | grep -q '"status": 200'; then
            echo "::notice::Response validated and marked as a successful upload"
          else
            echo "::error::Response contained non-200 status or success was not true. Marked as an unsuccessful upload"
            exit 1
          fi
