name: Harbor Copy Image Template
description: Copies a Docker image artifact from one Harbor repository to another

on:
  workflow_call:
    inputs:
      copy:
        required: true
        type: boolean
        description: Whether to perform the copy operation
      runs-on:
        required: true
        type: string
        description: Runner to use
      harbor-url:
        required: false
        type: string
        default: https://harbor.axinom.com
        description: Harbor registry URL
      source-project:
        required: false
        type: string
        default: mosaic
        description: Source Harbor project name
      source-repository:
        required: true
        type: string
        description: Source repository path within the project (e.g., customizable-services-dev/media-service)
      source-tag:
        required: true
        type: string
        description: Source image tag to copy
      destination-project:
        required: false
        type: string
        default: mosaic
        description: Destination Harbor project name
      destination-repository:
        required: true
        type: string
        description: Destination repository path within the project
      destination-tag:
        required: true
        type: string
        description: Tag for the copied image in destination repository
    secrets:
      docker-registry-username:
        required: true
        description: Harbor registry username
      docker-registry-password:
        required: true
        description: Harbor registry password

permissions: {}

jobs:
  copy:
    if: ${{ inputs.copy }}
    name: Copy ${{ inputs.source-repository }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Copy image in Harbor
        env:
          DOCKER_REGISTRY_USERNAME: ${{ secrets.docker-registry-username }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.docker-registry-password }}
        run: |
          HARBOR_URL="${{ inputs.harbor-url }}"
          # Strip the scheme (https://) to get the registry host used in image references
          REGISTRY_HOST="${HARBOR_URL#*://}"

          SOURCE_IMAGE="${REGISTRY_HOST}/${{ inputs.source-project }}/${{ inputs.source-repository }}:${{ inputs.source-tag }}"
          DEST_IMAGE="${REGISTRY_HOST}/${{ inputs.destination-project }}/${{ inputs.destination-repository }}:${{ inputs.destination-tag }}"

          echo "::notice::Copying image from '${SOURCE_IMAGE}' to '${DEST_IMAGE}'"

          echo "${DOCKER_REGISTRY_PASSWORD}" | docker login "${REGISTRY_HOST}" -u "${DOCKER_REGISTRY_USERNAME}" --password-stdin

          # Pull the source image, re-tag it for the destination repository, and push
          docker pull "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${DEST_IMAGE}"
          docker push "${DEST_IMAGE}"

          docker logout "${REGISTRY_HOST}"

          echo "::notice::Image copy completed: ${DEST_IMAGE}"
