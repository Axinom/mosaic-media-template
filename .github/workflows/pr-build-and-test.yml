name: PR Build and Test

#
# Why paths are not defined in .on.pull_request.include attribute.
#
# We will make this workflow an essential check for PRs to merge, within master branch protection ruleset.
# However, this workflow will not trigger if the changes within the PR do not belong to one of those
# file paths defined under on.pull_request.include attribute.
# This will result in PR not being able to merge.
#
# To avoid such incidents, this workflow will run for any and all PRs. The first job will then determine changes
# come from a predefined list of paths and if so the pipeline will continue to run.
#
on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  actions: read
  checks: write

env:
  NODE_OPTIONS: --max-old-space-size=16384
jobs:
  pre-check:
    if: github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2
    outputs:
      run-checks: ${{ steps.determine.outputs.run-checks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: paths-filter
        name: Check for affected directory paths
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - '!.adops/**'
              - '!.github/**'
              - '!.claude/**'
              - '!infra/**'
      - id: determine
        name: Determine if affected directory paths require checking
        run: |
          if [[ "${{ github.head_ref }}" == releases/* ]]; then
            echo "::notice::🌿 Source Branch: ${{ github.head_ref }}"
            echo "::notice::⏭️ Release PRs are not built and tested"
            echo "run-checks=false" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.paths-filter.outputs.relevant }}" == "false" ]]; then
            echo "::notice::📂 No changes detected in paths that require build and test"
            echo "::notice::⏭️ Skipping build and test validation"
            echo "run-checks=false" >> $GITHUB_OUTPUT
          else
            echo "::notice::🚀 Relevant changes detected, running build and test validation"
            echo "run-checks=true" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    needs: pre-check
    if: needs.pre-check.outputs.run-checks == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16.14-alpine3.23
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

    steps:
      - name: Setup docker
        uses: docker/setup-docker-action@v5
      - name: Setup docker compose
        uses: docker/setup-compose-action@v2
      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          fetch-tags: 'true'
          clean: 'true'

      - name: Install dependencies
        run: yarn install
      - name: Build services
        run: yarn build

      - name: Apply templates
        run: yarn apply-templates
      - name: Add placeholders to .env
        run: |
          sed -i 's/^\(TENANT_ID=\)$/\100000000-0000-0000-0000-000000000000/' .env
          sed -i 's/^\(ENVIRONMENT_ID=\)$/\100000000-0000-0000-0000-000000000000/' .env
          sed -i 's/^\(RABBITMQ_VHOST=\)$/\1fake/' .env
          sed -i 's/^\(RABBITMQ_USER=\)$/\1fake/' .env
          sed -i 's/^\(RABBITMQ_PASSWORD=\)$/\1fake/' .env
          sed -i 's/^\(DEV_SERVICE_ACCOUNT_CLIENT_ID=\)$/\1fake/' .env
          sed -i 's/^\(DEV_SERVICE_ACCOUNT_CLIENT_SECRET=\)$/\1fake/' .env
      - name: Reset temporary databases
        run: yarn test:reset:dbs

      - name: Run tests
        run: yarn test:ci --maxWorkers=8 --colors

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: JEST Tests
          path: '**/junit.xml'
          reporter: jest-junit

  #
  # Why this job exists.
  #
  # This is the single required status check for the default branch protection ruleset. It always runs
  # (even for draft PRs, where `pre-check` is skipped) so the check is always reported and never blocks
  # a PR by staying pending.
  #
  # It fails only when a preceding job explicitly failed. A skipped `build-and-test` (release PRs, or
  # PRs that touch no relevant paths) is a pass.
  #
  pr-verify-build-and-test:
    needs:
      - pre-check
      - build-and-test
    if: always()
    runs-on: ubicloud-standard-2
    steps:
      - name: Determine overall status
        run: |
          echo "::notice::pre-check: ${{ needs.pre-check.result }}"
          echo "::notice::build-and-test: ${{ needs.build-and-test.result }}"
          if [[ "${{ needs.pre-check.result }}" == "failure" ]]; then
            echo "::error::❌ PR pre check failed"
            exit 1
          fi
          if [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            echo "::error::❌ PR Build and Test failed"
            exit 1
          fi
          echo "::notice::✅ No preceding jobs failed"
