name: Update Hosting Service Template

on:
  workflow_call:
    secrets:
      managed-service-client-id:
        required: true
        description: Client ID for managed service account authentication
      managed-service-client-secret:
        required: true
        description: Client secret for managed service account authentication
      entitlement-drm-license-communication-key:
        required: false
        description: DRM license communication key for entitlement service
      entitlement-drm-license-communication-key-id:
        required: false
        description: DRM license communication key ID for entitlement service
      entitlement-entitlement-webhook-secret:
        required: false
        description: Entitlement webhook secret for entitlement service
      entitlement-geolite2-license-key:
        required: false
        description: GeoLite2 license key for entitlement service
      vod2live-api-key:
        required: false
        description: API key for VOD-to-live service
      vod2live-azure-storage-connection:
        required: false
        description: Azure storage connection string for VOD-to-live service
      vod2live-key-service-management-key:
        required: false
        description: Key service management key for VOD-to-live service
    inputs:
      runs-on:
        required: true
        type: string
      environment:
        required: true
        type: string
        description: GitHub environment name for deployment
      environment-subdomain:
        required: true
        type: string
        description: Environment subdomain (e.g., service.cb.axinom.net)
      gql-manifest-directory:
        required: false
        type: string
        default: '.github/hosting/v2'
        description: Directory containing GraphQL manifest files
      services-to-update:
        required: true
        type: string
        description: Comma-separated list of services to update (e.g., "media,catalog,entitlement")
      service-definition-id-catalog:
        required: false
        type: string
        description: Service definition ID for the catalog service
      service-definition-id-channel:
        required: false
        type: string
        description: Service definition ID for the channel service
      service-definition-id-entitlement:
        required: false
        type: string
        description: Service definition ID for the entitlement service
      service-definition-id-media:
        required: false
        type: string
        description: Service definition ID for the media service
      service-definition-id-vod-to-live:
        required: false
        type: string
        description: Service definition ID for the VOD-to-live service
      geolite2-download-url:
        required: false
        type: string
        description: Download URL for the GeoLite2 database
      drm-key-seed-id:
        required: false
        type: string
        description: DRM key seed ID
      virtual-channel-management-api-base-url:
        required: false
        type: string
        description: Base URL for the virtual channel management API
      virtual-channel-origin-base-url:
        required: false
        type: string
        description: Base URL for the virtual channel origin
      azure-blob-container-name:
        required: false
        type: string
        description: Azure Blob Storage container name
      key-service-api-base-url:
        required: false
        type: string
        description: Base URL for the key service API
      key-service-tenant-id:
        required: false
        type: string
        description: Tenant ID for the key service

permissions:
  contents: read

jobs:
  update-hosting:
    name: Update Hosting Service
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Replace tokens in GraphQL files
        uses: cschleiden/replace-tokens@v1
        with:
          files: '["${{ inputs.gql-manifest-directory }}/*.graphql"]'
        env:
          managed-service-client-id: ${{ secrets.managed-service-client-id }}
          managed-service-client-secret: ${{ secrets.managed-service-client-secret }}
          drm-license-communication-key: ${{ secrets.entitlement-drm-license-communication-key }}
          drm-license-communication-key-id: ${{ secrets.entitlement-drm-license-communication-key-id }}
          entitlement-webhook-secret: ${{ secrets.entitlement-entitlement-webhook-secret }}
          geolite2-license-key: ${{ secrets.entitlement-geolite2-license-key }}
          api-key: ${{ secrets.vod2live-api-key }}
          azure-storage-connection: ${{ secrets.vod2live-azure-storage-connection }}
          key-service-management-key: ${{ secrets.vod2live-key-service-management-key }}
          geoLite2DownloadUrl: ${{ inputs.geolite2-download-url }}
          drmKeySeedId: ${{ inputs.drm-key-seed-id }}
          virtualChannelManagementApiBaseUrl: ${{ inputs.virtual-channel-management-api-base-url }}
          virtualChannelOriginBaseUrl: ${{ inputs.virtual-channel-origin-base-url }}
          azureBlobContainerName: ${{ inputs.azure-blob-container-name }}
          keyServiceApiBaseUrl: ${{ inputs.key-service-api-base-url }}
          keyServiceTenantId: ${{ inputs.key-service-tenant-id }}
          serviceDefinitionIdCatalog: ${{ inputs.service-definition-id-catalog }}
          serviceDefinitionIdChannel: ${{ inputs.service-definition-id-channel }}
          serviceDefinitionIdEntitlement: ${{ inputs.service-definition-id-entitlement }}
          serviceDefinitionIdMedia: ${{ inputs.service-definition-id-media }}
          serviceDefinitionIdVodToLive: ${{ inputs.service-definition-id-vod-to-live }}

      - name: Get token from ID service
        id: get-token
        working-directory: ${{ inputs.gql-manifest-directory }}
        run: |
          echo "::notice::Fetching JWT from ID service"

          payload=$(cat id.get-token.graphql | tr -d '\n' | sed 's/"/\\"/g')
          response=$(curl -g --silent \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "{ \"query\": \"$payload\" }" \
            "https://id.${{ inputs.environment-subdomain }}/graphql")

          token=$(echo "$response" | jq -r '.data.authenticateManagedServiceAccount.accessToken')

          if [[ "$token" == "null" || -z "$token" ]]; then
            echo "::error::Failed to retrieve token from ID service"
            echo "::error::Response: $response"
            exit 1
          fi

          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "::notice::Successfully fetched JWT from ID service"

      - name: Update service definitions in hosting service
        working-directory: ${{ inputs.gql-manifest-directory }}
        env:
          TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          failed=0

          for service in $(echo "${{ inputs.services-to-update }}" | tr ',' ' '); do
            manifest_file="${service}.create-axinom-service-deployment-manifest.graphql"

            echo "::notice::Updating service definition for $service"

            if [ ! -f "$manifest_file" ]; then
              echo "::warning::No GQL manifest exists for $service service; Skipping..."
              continue
            fi

            payload=$(cat "$manifest_file" | tr -d '\n' | sed 's/"/\\"/g')
            response=$(curl -g --silent \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $TOKEN" \
              -d "{ \"query\": \"$payload\" }" \
              "https://hosting.${{ inputs.environment-subdomain }}/graphql")

            if [[ $(echo "$response" | jq '.data.createAxinomServiceDeploymentManifest') == "null" ]]; then
              echo "::error::Failed to update definitions for $service"
              echo "::error::Response: $response"
              failed=1
            else
              echo "::notice::Successfully updated service definition for $service"
            fi
          done

          if [ $failed -eq 1 ]; then
            exit 1
          fi
