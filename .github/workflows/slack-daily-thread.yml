name: Slack Daily Thread

on:
  schedule:
    - cron: '1 0 * * *' # 00:01 UTC daily
  workflow_dispatch: # Manual trigger for testing

jobs:
  create-daily-thread:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Post daily thread to Slack
        id: slack
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_API_TOKEN_NAVY_CHANNELS }}
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID_NAVY_CB_AUTO_RELEASE }}
            text: "Daily Build Status - ${{ steps.date.outputs.date }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "Daily Build Status - ${{ steps.date.outputs.date }}"
              - type: divider
              - type: context
                elements:
                  - type: mrkdwn
                    text: "Build updates will be posted as replies to this thread"

      - name: Extract and save thread ID
        run: |
          echo '${{ steps.slack.outputs.response }}' | jq -r '.ts' > slack-thread-id.txt
          echo "Thread ID: $(cat slack-thread-id.txt)"

      - name: Upload thread ID artifact
        uses: actions/upload-artifact@v4
        with:
          name: slack-daily-thread
          path: slack-thread-id.txt
          retention-days: 1
          overwrite: true
