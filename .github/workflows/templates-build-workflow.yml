name: Mosaic Workflow Build

on:
  workflow_call:
    inputs:
      build:
        required: true
        type: boolean
        description: Indicates if the build should continue
      service-name:
        required: true
        type: string
      checkout-fetch-depth:
        required: false
        type: number
        default: 1
      service-build-command:
        required: true
        type: string
      service-directory-path:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      run-id:
        required: true
        type: string
      dash-url-template:
        required: false
        type: string
        default: https://vtb.axinom.com/?dashUrl=[STREAM_URL]
      hls-url-template:
        required: false
        type: string
        default: https://vtb.axinom.com/?hlsUrl=[STREAM_URL]

permissions:
  contents: read

jobs:
  build_and_publish:
    if: ${{ inputs.build }}
    name: Build and Publish Artifact
    runs-on: ${{ inputs.runs-on }}
    steps:
      - id: metadata
        run: |
          DATE=$(date -u +%Y.%m.%d-%H.%M.%S)
          # Compact, semver-safe timestamp (no dots / leading-zero segments) used to
          # make the pilet package version unique per build so the feed accepts it.
          VERSION_SUFFIX=$(date -u +%Y%m%d-%H%M)
          BRANCH_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          BRANCH_NAME_SAFE="${BRANCH_NAME//\//_}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "version-suffix=$VERSION_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH_NAME_SAFE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.checkout-fetch-depth }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Make pilet version unique
        working-directory: ${{ inputs.service-directory-path }}
        run: |
          # Edit the version field of THIS pilet's package.json only (scoped via
          # working-directory). npm pkg set is a plain field write - no version bump
          # or git machinery - mirroring what the Azure DevOps pipeline did. pilet
          # pack then emits <name>-<version>.tgz so the archive is uniquely named.
          CURRENT_VERSION=$(npm pkg get version | jq -r 'to_entries[0].value' | xargs)
          UNIQUE_VERSION="${CURRENT_VERSION}-${{ steps.metadata.outputs.version-suffix }}"

          echo "::notice::Setting pilet version to ${UNIQUE_VERSION}"
          npm pkg set "version=${UNIQUE_VERSION}"

          echo "Workflow version output:-"
          npm pkg get version

      - run: yarn install --immutable

      - run: yarn run ${{ inputs.service-build-command }}
        env:
          DASH_URL_TEMPLATE: ${{ inputs.dash-url-template }}
          HLS_URL_TEMPLATE: ${{ inputs.hls-url-template }}

      - id: artifact
        run: |
          ARTIFACT_NAME="${{ inputs.service-directory-path }}"
          ARTIFACT_NAME="${ARTIFACT_NAME//\//-}"
          ARTIFACT_NAME="$ARTIFACT_NAME-${{ steps.metadata.outputs.branch }}-${{ steps.metadata.outputs.date }}"
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload pilet artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: '*.tgz'
          retention-days: 30

      - name: Upload build result
        run: |
          echo "${{ inputs.service-name }}: ${{ inputs.run-id }}" > result.txt
      - uses: actions/upload-artifact@v6
        with:
          name: build-result-${{ inputs.service-name }}
          path: result.txt
          retention-days: 1
