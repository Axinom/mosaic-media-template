---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vod-to-live
  annotations:
    deployment.kubernetes.io/revision: '1'
    kubectl.kubernetes.io/default-container: 'app'
spec:
  selector:
    matchLabels:
      app: vod-to-live
  replicas: 1
  template:
    metadata:
      labels:
        app: vod-to-live
    spec:
      nodeSelector:
        mosaic.axinom.com/workload_type: general
      imagePullSecrets:
        - name: axinom-registry-customizable-services-pull
      containers:
        - name: app
          image: harbor.axinom.com/mosaic/customizable-services-dev/vod-to-live-service:latest
          env:
            - name: SERVICE_ID
              value: vod-to-live-service
            - name: PORT
              value: '11900'
            - name: GRAPHQL_GUI_ENABLED
              value: 'true'
            - name: PROLONG_PLAYLIST_TO_24_HOURS
              value: 'FALSE'
            - name: CATCH_UP_DURATION_IN_MINUTES
              value: '60'
            - name: CHANNEL_PROCESSING_WAIT_TIME_IN_SECONDS
              value: '600'
            - name: TRX_DB_SCHEMA
              value: 'app_hidden'
            - name: TRX_NEXT_MESSAGES_FUNCTION_SCHEMA
              value: 'app_hidden'
            - name: TRX_MESSAGE_PROCESSING_TIMEOUT_IN_MS
              value: '15000'
            - name: TRX_NEXT_MESSAGES_LOCK_IN_MS
              value: '15000'
            - name: TRX_MAX_ATTEMPTS
              value: '5'
            - name: TRX_MAX_POISONOUS_ATTEMPTS
              value: '3'
            - name: TRX_MESSAGE_CLEANUP_INTERVAL_IN_MS
              value: '300000'
            - name: TRX_MESSAGE_CLEANUP_PROCESSED_IN_SEC
              value: '604800'
            - name: TRX_MESSAGE_CLEANUP_ABANDONED_IN_SEC
              value: '1209600'
            - name: TRX_MESSAGE_CLEANUP_ALL_IN_SEC
              value: '5184000'
            - name: TRX_NEXT_MESSAGES_BATCH_SIZE
              value: '5'
            - name: TRX_NEXT_MESSAGES_POLLING_INTERVAL_IN_MS
              value: '500'
            - name: TRX_OUTBOX_DB_TABLE
              value: 'outbox'
            - name: TRX_OUTBOX_NEXT_MESSAGES_FUNCTION_NAME
              value: 'next_outbox_messages'
            - name: TRX_OUTBOX_ENABLE_MAX_ATTEMPTS_PROTECTION
              value: 'false'
            - name: TRX_OUTBOX_ENABLE_POISONOUS_MESSAGE_PROTECTION
              value: 'false'
            - name: TRX_INBOX_DB_TABLE
              value: 'inbox'
            - name: TRX_INBOX_NEXT_MESSAGES_FUNCTION_NAME
              value: 'next_inbox_messages'
            - name: TRX_INBOX_ENABLE_MAX_ATTEMPTS_PROTECTION
              value: 'true'
            - name: TRX_INBOX_ENABLE_POISONOUS_MESSAGE_PROTECTION
              value: 'true'
              #KEY_SERVICE_API_BASE_URL=
              #KEY_SERVICE_TENANT_ID=
              #KEY_SERVICE_MANAGEMENT_KEY=
              #DRM_KEY_SEED_ID=

          ports:
            - containerPort: 9090
              name: metrics
              protocol: TCP
            - containerPort: 9911
              name: diagnostics
              protocol: TCP
            - containerPort: 10300
              name: app
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /live
              port: 9000
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 30
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: 9000
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 15
