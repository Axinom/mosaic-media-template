apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv-entitlement
spec:
  provider:
    azurekv:
      authSecretRef:
        clientId:
          key: ClientId
          name: azure-external-access-service-principal-credentials
        clientSecret:
          key: ClientSecret
          name: azure-external-access-service-principal-credentials
      authType: ServicePrincipal
      environmentType: PublicCloud
      tenantId: db0b4725-608f-4d84-b2e3-7fc15b0cb2d4
      vaultUrl: https://cus-prod-entitle-x0a.vault.azure.net
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: key-vault-entitlement
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: SecretStore
    name: azure-kv-entitlement
  target:
    name: key-vault-entitlement
    creationPolicy: Owner
  data:
  - secretKey: database-name
    remoteRef:
      key: secret/postgres-service-database-name
  - secretKey: database-owner-password
    remoteRef:
      key: secret/postgres-owner-role-password
  - secretKey: database-owner-username
    remoteRef:
      key: secret/postgres-owner-role-name
  - secretKey: database-login-username
    remoteRef:
      key: secret/postgres-login-role-name
  - secretKey: database-login-password
    remoteRef:
      key: secret/postgres-login-role-password
  - secretKey: database-gql-username
    remoteRef:
      key: secret/postgres-gql-role-name
  - secretKey: rabbitmq-password
    remoteRef:
      key: secret/rabbitmq-password
  - secretKey: rabbitmq-user
    remoteRef:
      key: secret/rabbitmq-user
  - secretKey: service-account-client-secret
    remoteRef:
      key: secret/service-account-client-secret
  - secretKey: service-account-client-id
    remoteRef:
      key: secret/service-account-client-id
  - secretKey: geolite2-license-key
    remoteRef:
      key: secret/geolite2-license-key
  - secretKey: drm-license-communication-key-id
    remoteRef:
      key: secret/drm-license-communication-key-id
  - secretKey: drm-license-communication-key
    remoteRef:
      key: secret/drm-license-communication-key
  - secretKey: entitlement-webhook-secret
    remoteRef:
      key: secret/entitlement-webhook-secret
  - secretKey: manifest-webhook-secret
    remoteRef:
      key: secret/manifest-webhook-secret
