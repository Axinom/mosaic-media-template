---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: entitlement-app
spec:
  hostnames:
    - cb-navy-entitlement.axtest.net
  parentRefs:
    - name: mosaic
      namespace: gateway
  rules:
    - backendRefs:
        - name: entitlement
          port: 10300
      matches:
        - path:
            type: PathPrefix
            value: /
