---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: channel-app
spec:
  hostnames:
    - mosaic-ott-channel.axprod.net
  parentRefs:
    - name: mosaic
      namespace: gateway
  rules:
    - backendRefs:
        - name: channel
          port: 11800
      matches:
        - path:
            type: PathPrefix
            value: /
