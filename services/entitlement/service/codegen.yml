overwrite: true
generates:
  src/generated/graphql/catalog.ts:
    schema: ${CATALOG_SERVICE_BASE_URL}/graphql
    documents: 'src/graphql/documents/catalog-*.graphql'
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-graphql-request'
    config:
      rawRequest: true
      withHOC: false
      withComponent: false
      withMutationFn: false
