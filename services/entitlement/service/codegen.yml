overwrite: true
config:
  # Since @graphql-codegen/typescript-operations v6 the operations plugin emits its
  # own Input/Enum types. The output below also runs the `typescript` plugin, so it
  # points `importSchemaTypesFrom` at its own file to reuse those schema types
  # instead of emitting duplicates.
  # Keep `any` for custom scalars (the v6 default changed to `unknown`).
  defaultScalarType: any
generates:
  src/generated/graphql/catalog.ts:
    schema: ${CATALOG_SERVICE_BASE_URL}/graphql
    documents: 'src/graphql/documents/catalog-*.graphql'
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-graphql-request'
    config:
      importSchemaTypesFrom: 'src/generated/graphql/catalog.ts'
      rawRequest: true
      withHOC: false
      withComponent: false
      withMutationFn: false
