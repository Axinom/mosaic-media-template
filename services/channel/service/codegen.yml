overwrite: true
config:
  # Since @graphql-codegen/typescript-operations v6 the operations plugin emits its
  # own Input/Enum types. Each output below also runs the `typescript` plugin, so
  # every target points `importSchemaTypesFrom` at its own file to reuse those
  # schema types instead of emitting duplicates.
  # Keep `any` for custom scalars (the v6 default changed to `unknown`).
  defaultScalarType: any
generates:
  src/generated/graphql/image.ts:
    schema: '${IMAGE_SERVICE_BASE_URL}/graphql'
    documents: 'src/graphql/documents/image-*.graphql'
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-graphql-request'
    config:
      importSchemaTypesFrom: 'src/generated/graphql/image.ts'
      rawRequest: true
      withHOC: false
      withComponent: false
      withMutationFn: false
  src/generated/graphql/video.ts:
    schema: '${VIDEO_SERVICE_BASE_URL}/graphql'
    documents: 'src/graphql/documents/video-*.graphql'
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-graphql-request'
    config:
      importSchemaTypesFrom: 'src/generated/graphql/video.ts'
      rawRequest: true
      withHOC: false
      withComponent: false
      withMutationFn: false
  src/generated/graphql/localization.ts:
    schema: '${LOCALIZATION_SERVICE_BASE_URL}/graphql'
    documents: 'src/graphql/documents/localization-*.graphql'
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-graphql-request'
    config:
      importSchemaTypesFrom: 'src/generated/graphql/localization.ts'
      rawRequest: true
      withHOC: false
      withComponent: false
      withMutationFn: false
  src/generated/graphql/id.ts:
    schema: '${ID_SERVICE_AUTH_BASE_URL}/graphql'
    documents: 'src/graphql/documents/id-*.graphql'
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-graphql-request'
    config:
      importSchemaTypesFrom: 'src/generated/graphql/id.ts'
      rawRequest: true
      withHOC: false
      withComponent: false
      withMutationFn: false
