fragment SeasonExplorerProperties on Season {
  id
  publishStatus
  index
  externalId
  tvshow {
    id
    title
  }
  seasonsImages(condition: { imageType: COVER }) {
    nodes {
      imageId
    }
  }
  seasonsTvshowGenres {
    nodes {
      tvshowGenres {
        title
      }
    }
  }
  createdDate
  updatedDate
  seasonsTags {
    nodes {
      name
    }
  }
  seasonsCasts {
    nodes {
      name
    }
  }
  released
  seasonsProductionCountries {
    nodes {
      name
    }
  }
  studio
  publishedDate
}

query Seasons(
  $filter: SeasonFilter
  $orderBy: [SeasonsOrderBy!]
  $after: Cursor
) {
  filtered: seasons(
    filter: $filter
    orderBy: $orderBy
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...SeasonExplorerProperties
    }
  }
  nonFiltered: seasons {
    totalCount
  }
}

subscription SeasonsMutated {
  seasonMutated {
    id
    eventKey
    season {
      ...SeasonExplorerProperties
    }
  }
}

query SeasonsGenresFilterOptions($orderBy: [SeasonsTvshowGenresOrderBy!]) {
  seasonsTvshowGenres(orderBy: $orderBy) {
    nodes {
      tvshowGenres {
        title
      }
    }
  }
}

query SeasonsCastsFilterOptions($orderBy: [SeasonsCastsOrderBy!]) {
  seasonsCasts(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}

query SeasonsTagsFilterOptions($orderBy: [SeasonsTagsOrderBy!]) {
  seasonsTags(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}

query SeasonsProductionCountriesFilterOptions(
  $orderBy: [SeasonsProductionCountriesOrderBy!]
) {
  seasonsProductionCountries(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}
