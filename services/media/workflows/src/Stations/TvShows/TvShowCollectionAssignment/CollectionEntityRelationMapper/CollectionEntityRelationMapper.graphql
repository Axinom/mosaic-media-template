query TvshowRelatedCollections($id: Int!) {
  tvshow(id: $id) {
    collectionRelations(orderBy: SORT_ORDER_ASC) {
      nodes {
        collection {
          entityId: id
          title
          publishStatus
          entityImages: collectionsImages {
            nodes {
              imageId
            }
          }
        }
        id
        sortOrder
      }
    }
  }
}
