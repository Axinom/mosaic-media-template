query TvshowsLicenses(
  $filter: TvshowsLicenseFilter
  $orderBy: [TvshowsLicensesOrderBy!]
  $after: Cursor
) {
  tvshowsLicenses(
    filter: $filter
    orderBy: $orderBy
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      tvshowsLicensesCountries {
        nodes {
          countryCode
          countryGroupId
        }
      }
      licenseEnd
      licenseStart
    }
  }
}

query GetAllCountryData {
  allCountryTypes(orderBy: NAME_ASC) {
    nodes {
      name
      id
    }
  }
}
