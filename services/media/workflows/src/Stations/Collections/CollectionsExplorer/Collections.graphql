fragment CollectionExplorerProperties on Collection {
  id
  title
  description
  externalId
  collectionsTags {
    nodes {
      name
    }
  }
  publishedDate
  createdDate
  updatedDate
  updatedUser
  publishStatus
  assetSubtype
  collectionCountries {
    nodes {
      collectionId
      countryGroupId
      countryId
    }
  }
  collectionsImages(
    filter: {
      imageType: {
        in: [COLLECTION_COVER_1X1, COLLECTION_COVER_4X1, COLLECTION_COVER]
      }
    }
    orderBy: IMAGE_TYPE_DESC
  ) {
    nodes {
      imageId
      imageType
    }
  }
  collectionRelations(orderBy: SORT_ORDER_DESC) {
    nodes {
      sortOrder
    }
  }
}

query Collections(
  $filter: CollectionFilter
  $orderBy: [CollectionsOrderBy!]
  $after: Cursor
) {
  filtered: collections(
    filter: $filter
    orderBy: $orderBy
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...CollectionExplorerProperties
    }
  }
  nonFiltered: collections {
    totalCount
  }
}

subscription CollectionsMutated {
  collectionMutated {
    id
    eventKey
    collection {
      ...CollectionExplorerProperties
    }
  }
}

mutation BulkDeleteCollections($filter: CollectionFilter) {
  deleteCollections(filter: $filter) {
    affectedIds
  }
}

mutation BulkPublishCollections($filter: CollectionFilter) {
  publishCollections(filter: $filter) {
    affectedIds
  }
}

mutation BulkUnpublishCollections($filter: CollectionFilter) {
  unpublishCollections(filter: $filter) {
    affectedIds
  }
}

mutation BulkCreateCollectionSnapshots($filter: CollectionFilter) {
  createCollectionSnapshots(filter: $filter) {
    affectedIds
  }
}

query GetAllCountryData {
  allCountryTypes(orderBy: NAME_ASC) {
    nodes {
      name
      id
    }
  }
}
