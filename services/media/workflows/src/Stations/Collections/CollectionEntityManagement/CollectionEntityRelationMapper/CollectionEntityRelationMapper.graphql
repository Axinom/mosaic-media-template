query CollectionRelatedEntities($id: Int!) {
  collection(id: $id) {
    collectionRelations(orderBy: SORT_ORDER_ASC) {
      nodes {
        movie {
          entityId: id
          title
          publishStatus
          entityImages: moviesImages {
            nodes {
              imageId
            }
          }
        }

        tvshow {
          entityId: id
          title
          publishStatus
          entityImages: tvshowsImages {
            nodes {
              imageId
            }
          }
        }

        episode {
          entityId: id
          title
          publishStatus
          entityImages: episodesImages {
            nodes {
              imageId
            }
          }
        }

        childCollection {
          entityId: id
          title
          publishStatus
          entityImages: collectionsImages {
            nodes {
              imageId
            }
          }
        }

        id
        sortOrder
      }
    }
  }
}
