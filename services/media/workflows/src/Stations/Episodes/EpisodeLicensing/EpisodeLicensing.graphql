query EpisodesLicenses(
  $filter: EpisodesLicenseFilter
  $orderBy: [EpisodesLicensesOrderBy!]
  $after: Cursor
) {
  episodesLicenses(
    filter: $filter
    orderBy: $orderBy
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      episodesLicensesCountries {
        nodes {
          countryCode
          countryGroupId
        }
      }
      licenseEnd
      licenseStart
    }
  }
}

query GetAllCountryData {
  allCountryTypes(orderBy: NAME_ASC) {
    nodes {
      name
      id
    }
  }
}
