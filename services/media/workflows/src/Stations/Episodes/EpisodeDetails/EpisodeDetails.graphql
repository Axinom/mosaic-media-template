query Episode($id: Int!) {
  episode(id: $id) {
    title
    originalTitle
    index
    synopsis
    description
    externalId
    publishingId
    ageRating
    contentOwner
    rating
    extendedField
    assetSubtype
    episodesTags {
      nodes {
        name
      }
    }
    episodesDirectors {
      nodes {
        name
      }
    }
    episodesTvshowGenres {
      nodes {
        tvshowGenres {
          title
        }
      }
    }
    episodesCasts {
      nodes {
        name
      }
    }
    studio
    episodesProductionCountries {
      nodes {
        name
      }
    }
    released
    id
    createdDate
    createdUser
    updatedDate
    updatedUser
    mainVideoId
    episodesTrailers {
      totalCount
    }
    episodesImages {
      nodes {
        imageType
        imageId
      }
    }
    publishStatus
    publishedDate
    publishedUser
    season {
      id
      index
      seasonsImages(condition: { imageType: SEASON_COVER_1X1 }, first: 1) {
        nodes {
          imageId
        }
      }
      tvshow {
        title
      }
    }
  }

  tvshowGenres {
    nodes {
      title
      id
    }
  }

  ageRatings {
    nodes {
      name
      id
    }
  }

  contentOwners {
    nodes {
      name
      id
    }
  }
}

mutation UpdateEpisode($input: UpdateEpisodeInput!) {
  updateEpisode(input: $input) {
    clientMutationId
    episode {
      id
      title
    }
  }
}

mutation DeleteEpisode($input: DeleteEpisodeInput!) {
  deleteEpisode(input: $input) {
    clientMutationId
  }
}

mutation PublishEpisode($id: Int!) {
  publishEpisode(episodeId: $id) {
    id
  }
}

mutation UnpublishEpisode($id: Int!) {
  unpublishEpisode(episodeId: $id) {
    id
  }
}

query EpisodeTitle($id: Int!) {
  episode(id: $id) {
    id
    title
  }
}

query SearchEpisodeTags($searchKey: String!, $limit: Int!) {
  getEpisodesTagsValues(
    filter: { startsWithInsensitive: $searchKey }
    first: $limit
  ) {
    nodes
  }
}

query SearchEpisodeCast($searchKey: String!, $limit: Int!) {
  getEpisodesCastsValues(
    filter: { startsWithInsensitive: $searchKey }
    first: $limit
  ) {
    nodes
  }
}

query SearchEpisodeDirector($searchKey: String!, $limit: Int!) {
  getEpisodesDirectorsValues(
    filter: { startsWithInsensitive: $searchKey }
    first: $limit
  ) {
    nodes
  }
}
