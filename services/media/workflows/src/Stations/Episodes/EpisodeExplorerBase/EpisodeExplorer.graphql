fragment EpisodeExplorerProperties on Episode {
  publishStatus
  title
  index
  externalId
  mainVideoId
  season {
    id
    index
    tvshow {
      title
    }
  }
  episodesImages(condition: { imageType: COVER }) {
    nodes {
      imageId
    }
  }
  episodesTvshowGenres {
    nodes {
      tvshowGenres {
        title
      }
    }
  }
  createdDate
  updatedDate
  originalTitle
  episodesTags {
    nodes {
      name
    }
  }
  episodesCasts {
    nodes {
      name
    }
  }
  released
  episodesProductionCountries {
    nodes {
      name
    }
  }
  studio
  publishedDate
  id
}

query Episodes(
  $filter: EpisodeFilter
  $orderBy: [EpisodesOrderBy!]
  $after: Cursor
) {
  filtered: episodes(
    filter: $filter
    orderBy: $orderBy
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...EpisodeExplorerProperties
    }
  }
  nonFiltered: episodes {
    totalCount
  }
}

subscription EpisodesMutated {
  episodeMutated {
    id
    eventKey
    episode {
      ...EpisodeExplorerProperties
    }
  }
}

query EpisodesTvshowGenresFilterOptions(
  $orderBy: [EpisodesTvshowGenresOrderBy!]
) {
  episodesTvshowGenres(orderBy: $orderBy) {
    nodes {
      tvshowGenres {
        title
      }
    }
  }
}

query EpisodesCastsFilterOptions($orderBy: [EpisodesCastsOrderBy!]) {
  episodesCasts(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}

query EpisodesTagsFilterOptions($orderBy: [EpisodesTagsOrderBy!]) {
  episodesTags(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}

query EpisodesProductionCountriesFilterOptions(
  $orderBy: [EpisodesProductionCountriesOrderBy!]
) {
  episodesProductionCountries(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}
