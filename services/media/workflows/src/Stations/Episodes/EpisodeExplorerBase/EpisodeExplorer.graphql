fragment EpisodeExplorerProperties on Episode {
  publishStatus
  title
  index
  externalId
  mainVideoId
  season {
    id
    index
    tvshow {
      title
    }
  }
  episodesImages(condition: { imageType: EPISODE_COVER_1X1 }) {
    nodes {
      imageId
    }
  }
  episodesTvshowGenres {
    nodes {
      tvshowGenres {
        title
      }
    }
  }
  createdDate
  updatedDate
  originalTitle
  assetSubtype
  episodesTags {
    nodes {
      name
    }
  }
  episodesCasts {
    nodes {
      name
    }
  }
  released
  episodesProductionCountries {
    nodes {
      name
    }
  }
  episodesLicenses {
    nodes {
      licenseEnd
      licenseStart
      episodesLicensesCountries {
        nodes {
          countryCode
          countryGroupId
        }
      }
    }
  }
  publishedDate
  id
  ageRating
  contentOwner
}

query Episodes(
  $filter: EpisodeFilter
  $orderBy: [EpisodesOrderBy!]
  $after: Cursor
) {
  filtered: episodes(
    filter: $filter
    orderBy: $orderBy
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...EpisodeExplorerProperties
    }
  }
  nonFiltered: episodes {
    totalCount
  }
}

subscription EpisodesMutated {
  episodeMutated {
    id
    eventKey
    episode {
      ...EpisodeExplorerProperties
    }
  }
}

query GetEpisodesFilterOptionsData {
  ageRatings {
    nodes {
      id
      name
    }
  }

  contentOwners {
    nodes {
      id
      name
    }
  }

  movieGenres {
    nodes {
      id
      title
    }
  }

  allCountryTypes(orderBy: NAME_ASC) {
    nodes {
      name
      id
    }
  }
}
