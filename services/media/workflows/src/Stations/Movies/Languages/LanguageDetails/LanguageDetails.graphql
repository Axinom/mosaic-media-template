query Language($id: Int!) {
  language(id: $id) {
    code
    createdDate
    createdUser
    id
    native
    title
    updatedDate
    updatedUser
  }
}

query LanguageTitle($id: Int!) {
  language(id: $id) {
    id
    title
  }
}

mutation DeleteLanguage($input: DeleteLanguageInput!) {
  deleteLanguage(input: $input) {
    clientMutationId
  }
}

mutation UpdateLanguage($input: UpdateLanguageInput!) {
  updateLanguage(input: $input) {
    clientMutationId
  }
}
