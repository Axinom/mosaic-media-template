fragment LanguageExplorerProperties on Language {
  code
  title
  createdDate
  createdUser
  id
  native
  updatedDate
  updatedUser
}

query Languages($filter: LanguageFilter, $after: Cursor) {
  filtered: languages(
    filter: $filter
    orderBy: TITLE_ASC
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...LanguageExplorerProperties
    }
  }
  nonFiltered: languages(orderBy: TITLE_ASC) {
    totalCount
  }
}
