fragment MovieExplorerProperties on Movie {
  id
  title
  originalTitle
  externalId
  mainVideoId
  ageRating
  contentOwner
  businessType
  assetSubtype
  moviesLicenses {
    nodes {
      licenseEnd
      licenseStart
      moviesLicensesCountries {
        nodes {
          code
        }
      }
    }
  }
  moviesImages(condition: { imageType: COVER_1X1 }) {
    nodes {
      imageId
    }
  }
  moviesTags {
    nodes {
      name
    }
  }
  moviesMovieGenres {
    nodes {
      movieGenres {
        title
      }
    }
  }
  moviesCasts {
    nodes {
      name
    }
  }
  released
  moviesProductionCountries {
    nodes {
      name
    }
  }
  collectionRelations {
    nodes {
      collection {
        title
      }
    }
  }
  studio
  publishedDate
  createdDate
  updatedDate
  updatedUser
  publishStatus
}

query Movies($filter: MovieFilter, $orderBy: [MoviesOrderBy!], $after: Cursor) {
  filtered: movies(
    filter: $filter
    orderBy: $orderBy
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...MovieExplorerProperties
    }
  }
  nonFiltered: movies {
    totalCount
  }
}

subscription MoviesMutated {
  movieMutated {
    id
    eventKey
    movie {
      ...MovieExplorerProperties
    }
  }
}

query GetMoviesFilterOptionsData {
  ageRatings {
    nodes {
      id
      name
    }
  }

  contentOwners {
    nodes {
      id
      name
    }
  }

  movieGenres {
    nodes {
      id
      title
    }
  }

  collections {
    nodes {
      id
      title
    }
  }

  allCountryTypes(orderBy: NAME_ASC) {
    nodes {
      name
      id
    }
  }
}
