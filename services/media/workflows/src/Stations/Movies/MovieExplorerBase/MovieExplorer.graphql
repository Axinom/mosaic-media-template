fragment MovieExplorerProperties on Movie {
  id
  title
  originalTitle
  externalId
  mainVideoId
  moviesImages(condition: { imageType: COVER }) {
    nodes {
      imageId
    }
  }
  moviesTags {
    nodes {
      name
    }
  }
  moviesMovieGenres {
    nodes {
      movieGenres {
        title
      }
    }
  }
  moviesCasts {
    nodes {
      name
    }
  }
  released
  moviesProductionCountries {
    nodes {
      name
    }
  }
  studio
  publishedDate
  createdDate
  updatedDate
  publishStatus
}

query Movies($filter: MovieFilter, $orderBy: [MoviesOrderBy!], $after: Cursor) {
  filtered: movies(
    filter: $filter
    orderBy: $orderBy
    first: 30
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...MovieExplorerProperties
    }
  }
  nonFiltered: movies {
    totalCount
  }
}

subscription MoviesMutated {
  movieMutated {
    id
    eventKey
    movie {
      ...MovieExplorerProperties
    }
  }
}

query MovieGenresFilterOptions($orderBy: [MovieGenresOrderBy!]) {
  movieGenres(orderBy: $orderBy) {
    nodes {
      title
    }
  }
}

query MovieTagsFilterOptions($orderBy: [MoviesTagsOrderBy!]) {
  moviesTags(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}

query MovieCastsFilterOptions($orderBy: [MoviesCastsOrderBy!]) {
  moviesCasts(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}

query MovieCountriesFilterOptions(
  $orderBy: [MoviesProductionCountriesOrderBy!]
) {
  moviesProductionCountries(orderBy: $orderBy) {
    nodes {
      name
    }
  }
}
