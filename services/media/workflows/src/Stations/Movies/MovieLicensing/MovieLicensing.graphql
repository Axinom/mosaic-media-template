query MoviesLicenses(
  $filter: MoviesLicenseFilter
  $orderBy: [MoviesLicensesOrderBy!]
  $after: Cursor
) {
  moviesLicenses(filter: $filter, orderBy: $orderBy, first: 30, after: $after) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id

      moviesLicensesCountries {
        nodes {
          countryCode
          countryGroupId
        }
      }
      licenseEnd
      licenseStart
    }
  }
}

query GetAllCountryData {
  allCountryTypes(orderBy: NAME_ASC) {
    nodes {
      name
      id
    }
  }
}
